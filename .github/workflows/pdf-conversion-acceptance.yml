name: PDF conversion acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pdf-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conversion:
    if: github.repository == 'tang-vu/pdf-word'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Pin validated npm
        run: npm install --global npm@11.9.0
      - name: Install unchanged application dependencies
        run: npm ci --no-audit
      - name: Install isolated browser tooling
        run: npm ci --prefix tests/browser --ignore-scripts --no-audit
      - name: Audit isolated browser tooling
        run: |
          mkdir -p tests/browser/artifacts
          set +e
          npm audit --prefix tests/browser --audit-level=low --json > tests/browser/artifacts/browser-tool-audit.json
          audit_status=$?
          printf '%s\n' "$audit_status" > tests/browser/artifacts/browser-tool-audit.exit-code
          exit "$audit_status"
      - name: Browser observation orchestration tests
        run: node --test tests/browser/observation.test.cjs
      - name: Core conversion tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Install official hosted browser engines
        run: node tests/browser/node_modules/playwright/cli.js install --with-deps chromium firefox webkit
      - name: Accept production and development conversions
        run: npm run acceptance --prefix tests/browser
      - name: Preserve browser and DOCX evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: tests/browser/artifacts/
          if-no-files-found: error
          retention-days: 14
